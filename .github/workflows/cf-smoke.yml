name: CF Runtime Smoke

# Retained only until the Cloudflare Preview cutover in docs/remote-verification.md.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cf-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: vars.CF_PREVIEW_VALIDATION != 'true'
    name: OpenNext / workerd smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: pnpm` resolves the store path by
      # invoking pnpm, so pnpm has to be on PATH first. Version comes from the
      # `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch lens catalog
        run: pnpm run catalog:fetch
        env:
          LENS_CATALOG_TOKEN: ${{ secrets.LENS_CATALOG_TOKEN }}

      - name: Build for Cloudflare (OpenNext)
        # The temporary baseline needs only local output, not a deployment or notification.
        run: pnpm exec opennextjs-cloudflare build

      - name: Boot workerd and smoke-test canaries
        run: |
          # wrangler dev runs the worker on local workerd (same runtime as prod,
          # local mode — no CF account needed). Auth refuses to start without a
          # secret, and wrangler dev reads worker secrets from .dev.vars only.
          echo "BETTER_AUTH_SECRET=cf-smoke-$(openssl rand -hex 16)" > .dev.vars
          pnpm exec wrangler dev --port 8787 &
          WRANGLER_PID=$!

          # Wait for readiness via the homepage (stays up even in the #397 bug;
          # the per-template assertions below are what catch detail-page outages).
          ready=""
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://localhost:8787/en"; then
              ready="yes"; echo "workerd ready after ${i} tries"; break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "✗ workerd did not become ready in time"
            kill "$WRANGLER_PID" 2>/dev/null || true
            exit 1
          fi

          BASE_URL=http://localhost:8787 UPTIME_PRERENDER_MANIFEST=.next/prerender-manifest.json \
            node scripts/uptime-check.mjs
          status=$?

          kill "$WRANGLER_PID" 2>/dev/null || true
          exit $status
