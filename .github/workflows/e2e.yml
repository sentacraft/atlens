name: E2E

# Playwright end-to-end tests against a PRODUCTION build (`next build` +
# `next start`), never `next dev` — dev-mode compilation/HMR makes the
# animation/scroll/hydration assertions flaky and diverges from what ships.
# The server is built and booted by Playwright's `webServer` (see
# playwright.config.ts); this job only needs to install deps.
#
# Why not the workerd/OpenNext runtime here: every page these tests touch
# renders without runtime CF bindings (search is client-side; only the untested
# /api/track beacon needs them). The workerd-only regression class is already
# gated by cf-smoke.yml + uptime.yml, which sweep the whole sitemap on the real
# runtime — so running the full browser matrix on workerd would add cost without
# signal. Heavier than the lint/typecheck/unit CI, so it lives on its own.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The container image must match the locked Playwright version exactly, or its browsers won't
  # match the test runner. Reading it from the lockfile keeps dependency bumps from breaking CI.
  playwright-version:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: lock
        run: |
          version=$(sed -n "s/^  '@playwright\/test@\([0-9.]*\)':$/\1/p" pnpm-lock.yaml | head -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright (next start)
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: pnpm` resolves the store path by
      # invoking pnpm, so pnpm has to be on PATH first. Version comes from the
      # `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch lens catalog
        run: pnpm run catalog:fetch
        env:
          LENS_CATALOG_TOKEN: ${{ secrets.LENS_CATALOG_TOKEN }}

      # Next.js incremental build cache (compiler/output), per the official CI
      # guidance. Restored before the webServer build runs and saved at job end;
      # keyed on lockfile + source so it invalidates correctly, with a lockfile-
      # level restore-key fallback. Self-contained — no other workflow touched.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # webServer runs `pnpm run build && next start` itself (CI=true disables
      # reuseExistingServer). Matrix: desktop + mobile WebKit + the PWA project.
      # --grep-invert drops @local-only tests (slow, low-gate-value animation /
      # scroll-choreography guards that still run locally) and the @text-fit sweep,
      # which runs on its own schedule (text-fit-check.yml).
      - name: Run E2E
        run: pnpm exec playwright test --project=chromium --project=ios-safari --project=ios-pwa --grep-invert "@local-only|@text-fit"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
