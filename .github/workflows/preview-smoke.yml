name: Cloudflare Preview smoke

# Cloudflare builds and deploys a branch Preview, then posts its fixed deployment URL as a commit
# status. The check run written by the last job is the result; the posted status is only the handoff.
# Activation, trust model and cutover: docs/remote-verification.md.

on:
  status:

# Every commit status starts a run, so the context and state are part of the group: otherwise an
# unrelated status on the same commit would cancel a queued probe.
concurrency:
  group: preview-smoke-${{ github.event.sha }}-${{ github.event.context }}-${{ github.event.state }}

permissions:
  contents: read

jobs:
  target:
    name: Validate the posted deployment
    if: github.event.context == 'cloudflare/preview-deployment' && github.event.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_url: ${{ steps.target.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: target
        name: Check the deployment address
        run: node --experimental-strip-types scripts/ci/preview-target.mts
        env:
          STATUS_SHA: ${{ github.event.sha }}
          STATUS_TARGET_URL: ${{ github.event.target_url }}
          STATUS_DESCRIPTION: ${{ github.event.description }}

      # The next job runs this commit's scripts, so it must be a branch head of this repository: a
      # status can also name a fork's pull request commit.
      - name: Require a current branch head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
        run: |
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/branches-where-head" \
            --jq '[.[] | select(.name != "main")] | length')
          if [ "$heads" -eq 0 ]; then
            echo "::error::$SHA is not the current head of a task branch"
            exit 1
          fi

  smoke:
    name: Probe the deployment
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Smoke-test every sitemap route
        run: node scripts/uptime-check.mjs
        env:
          BASE_URL: ${{ needs.target.outputs.base_url }}

      - name: SSG cache behavior
        run: node scripts/check-cache-headers.mjs
        env:
          BASE_URL: ${{ needs.target.outputs.base_url }}

  report:
    name: Report on the deployed commit
    if: ${{ always() && github.event.context == 'cloudflare/preview-deployment' && github.event.state == 'success' }}
    needs: [target, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      # Created already completed, so no failure can leave it in progress. The branch head is read
      # again because it may have moved while the probes ran.
      - name: Create the result check run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
          BASE_URL: ${{ needs.target.outputs.base_url }}
          TARGET_RESULT: ${{ needs.target.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/branches-where-head" \
            --jq '[.[] | select(.name != "main")] | length') || heads=0
          conclusion=failure
          if [ "$SMOKE_RESULT" = success ] && [ "$heads" -gt 0 ]; then conclusion=success; fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Cloudflare Preview smoke" -f head_sha="$SHA" -f details_url="$RUN_URL" \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=Preview smoke: $conclusion" \
            -f "output[summary]=Target: $TARGET_RESULT. Smoke: $SMOKE_RESULT. Task branches at this head: $heads. Deployment: ${BASE_URL:-not accepted}"
