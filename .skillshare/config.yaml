# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/project-config.schema.json

targets:
  - claude
  - codex
  - antigravity

skills:
  - name: vercel-react-best-practices
    source: github.com/vercel-labs/agent-skills/skills/react-best-practices
  - name: impeccable
    source: github.com/pbakaus/impeccable/.agents/skills/impeccable

hooks:
  entries:
    claude-sessionstart:
      bindings:
        claude:
          events:
            SessionStart:
              - hooks:
                  - command: bash "$(git rev-parse --show-toplevel)/scripts/worktree-setup.sh" --claude-hook
                    statusMessage: Checking worktree dependencies
                    timeout: 600
                    type: command
    claude-posttooluse:
      bindings:
        claude:
          events:
            PostToolUse:
              - hooks:
                  - command: node "$(git rev-parse --show-toplevel)/scripts/hooks/ui-token-review.mjs"
                    statusMessage: Checking shared UI tokens
                    timeout: 10
                    type: command
                  - command: node "$(git rev-parse --show-toplevel)/scripts/hooks/site-facts-review.mjs"
                    statusMessage: Checking site facts
                    timeout: 10
                    type: command
                  - command: node "$(git rev-parse --show-toplevel)/scripts/hooks/cjk-guard.mjs"
                    statusMessage: Checking for misplaced Chinese text
                    timeout: 10
                    type: command
                  - command: node "$(git rev-parse --show-toplevel)/scripts/hooks/launch-review.mjs"
                    statusMessage: Checking launch checklist
                    timeout: 10
                    type: command
                matcher: Edit|Write
    codex-sessionstart:
      bindings:
        codex:
          events:
            SessionStart:
              - hooks:
                  - command: bash "$(git rev-parse --show-toplevel)/scripts/worktree-setup.sh" --claude-hook
                    statusMessage: Checking worktree dependencies
                    timeout: 600
                    type: command
    codex-posttooluse:
      bindings:
        codex:
          events:
            PostToolUse:
              - hooks:
                  - command: node "$(git rev-parse --show-toplevel)/scripts/hooks/ui-token-review.mjs"
                    statusMessage: Checking shared UI tokens
                    timeout: 10
                    type: command
                  - command: node "$(git rev-parse --show-toplevel)/scripts/hooks/site-facts-review.mjs"
                    statusMessage: Checking site facts
                    timeout: 10
                    type: command
                  - command: node "$(git rev-parse --show-toplevel)/scripts/hooks/cjk-guard.mjs"
                    statusMessage: Checking for misplaced Chinese text
                    timeout: 10
                    type: command
                  - command: node "$(git rev-parse --show-toplevel)/scripts/hooks/launch-review.mjs"
                    statusMessage: Checking launch checklist
                    timeout: 10
                    type: command
                matcher: Edit|Write|apply_patch
    antigravity-sessionstart:
      bindings:
        antigravity:
          events:
            SessionStart:
              - command: bash "$(git rev-parse --show-toplevel)/scripts/worktree-setup.sh" --antigravity-hook
                timeout: 600
                type: command
    antigravity-posttooluse:
      bindings:
        antigravity:
          events:
            PostToolUse:
              - hooks:
                  - command: out=$(node "$(git rev-parse --show-toplevel)/scripts/hooks/ui-token-review.mjs"); printf '%s' "${out:-{}}"
                    timeout: 10
                    type: command
                  - command: out=$(node "$(git rev-parse --show-toplevel)/scripts/hooks/site-facts-review.mjs"); printf '%s' "${out:-{}}"
                    timeout: 10
                    type: command
                  - command: out=$(node "$(git rev-parse --show-toplevel)/scripts/hooks/cjk-guard.mjs"); printf '%s' "${out:-{}}"
                    timeout: 10
                    type: command
                  - command: out=$(node "$(git rev-parse --show-toplevel)/scripts/hooks/launch-review.mjs"); printf '%s' "${out:-{}}"
                    timeout: 10
                    type: command
                matcher: edit_file|write_file|write_to_file|replace_file_content|multi_replace_file_content

ignore:
  - .DS_Store
  - .git/
  - __pycache__/

audit:
  block_threshold: CRITICAL
