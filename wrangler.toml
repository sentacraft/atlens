name = "atlens"
main = ".open-next/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "enable_request_signal"]
# Production is served only on its custom domains, previews on <branch>.preview.atlens.app.
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Workers Builds rewrites Text bindings from this section on every deploy,
# overwriting anything added via the Dashboard. Non-secret config must
# live here. Secrets (e.g. GITHUB_TOKEN) stay in the Dashboard.
[vars]
SITE_URL = "https://atlens.app"
GITHUB_FEEDBACK_REPO = "sentacraft/atlens-pipeline"
GITHUB_FEEDBACK_ASSIGNEES = "sentacraft"
AUTH_EMAIL_FROM = "login@atlens.app"

# Secret names the Worker expects; add new ones with `pnpm run secret:add`. Values live
# in `wrangler secret put` (production) and each developer's .env.local (local).
# `wrangler deploy` fails if one is missing remotely; `pnpm run env:check` (run by
# predev) warns if one is missing locally.
[secrets]
required = [
  "ANALYTICS_ID_SECRET",
  "BETTER_AUTH_SECRET",
  "DASHSCOPE_API_KEY",
  "DEEPSEEK_API_KEY",
  "GITHUB_CLIENT_ID",
  "GITHUB_CLIENT_SECRET",
  "GITHUB_TOKEN",
  "GOOGLE_CLIENT_ID",
  "GOOGLE_CLIENT_SECRET",
  "OAUTH_PROXY_SECRET",
  "RATE_LIMIT_BYPASS",
]

[[d1_databases]]
binding = "ASKIRIS_DB"
database_name = "atlens-askiris-traces"
database_id = "6e45555d-ee19-4a77-af3c-b7fdebd11a61"
migrations_dir = "migrations/askiris-internal"

[[d1_databases]]
binding = "APP_DB"
database_name = "atlens-app"
database_id = "6a75a5c7-643e-414b-9cd2-51cf3826a2f2"
migrations_dir = "migrations/app"

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "atlens-analytics"
database_id = "b4606596-b605-49ff-9697-c6d0da11ab94"
migrations_dir = "migrations/analytics"

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "atlens-catalog"
database_id = "d3e66a39-2855-4d48-8a23-29c9c77363b7"
migrations_dir = "migrations/catalog"

[[send_email]]
name = "EMAIL"

[version_metadata]
binding = "CF_VERSION_METADATA"

# Ask Iris daily token budgets (src/lib/ai/token-budget.ts).
[[kv_namespaces]]
binding = "RATE_KV"
id = "b4eeeb3afdca4f038de649dd3ecbea5f"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Per-IP request rates (src/lib/rate-limit.ts). namespace_id must be unique in the account.
[[ratelimits]]
name = "RL_FEEDBACK"
namespace_id = "4801"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_ASKIRIS_FEEDBACK"
namespace_id = "4802"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_CHAT"
namespace_id = "4803"
simple = { limit = 6, period = 60 }

# Worker Previews inherit no vars, secrets or bindings from production: each one is
# declared again here, pointing storage at preview copies. wrangler-config.test.ts checks
# that every production binding and var has a preview entry.
[previews.vars]
SITE_URL = "https://atlens.app"
GITHUB_FEEDBACK_REPO = "sentacraft/atlens-pipeline"
GITHUB_FEEDBACK_ASSIGNEES = "sentacraft"
AUTH_EMAIL_FROM = "login@atlens.app"
# Better Auth needs a value to build each provider's authorization URL; the code exchange
# that uses the real secret runs on production through oAuthProxy.
GITHUB_CLIENT_SECRET = "unused-on-previews"
GOOGLE_CLIENT_SECRET = "unused-on-previews"

[[previews.d1_databases]]
binding = "ASKIRIS_DB"
database_name = "atlens-askiris-traces-preview"
database_id = "085245b9-fcdb-4948-904f-f51d357f7ccc"
migrations_dir = "migrations/askiris-internal"

[[previews.d1_databases]]
binding = "APP_DB"
database_name = "atlens-app-preview"
database_id = "14670bb5-ad46-4aec-a872-703443f4bed2"
migrations_dir = "migrations/app"

[[previews.d1_databases]]
binding = "ANALYTICS_DB"
database_name = "atlens-analytics-preview"
database_id = "bd85e0af-3947-4dcf-8416-a2e56b248516"
migrations_dir = "migrations/analytics"

[[previews.d1_databases]]
binding = "CATALOG_DB"
database_name = "atlens-catalog-preview"
database_id = "dbb0e5f4-481c-475a-95b8-8ab7d9187b6c"
migrations_dir = "migrations/catalog"

[[previews.send_email]]
name = "EMAIL"

[previews.version_metadata]
binding = "CF_VERSION_METADATA"

[[previews.kv_namespaces]]
binding = "RATE_KV"
id = "ccb5edd4d5514e3c9d083c1d3fdc91af"

[[previews.ratelimits]]
name = "RL_FEEDBACK"
namespace_id = "4811"
simple = { limit = 5, period = 60 }

[[previews.ratelimits]]
name = "RL_ASKIRIS_FEEDBACK"
namespace_id = "4812"
simple = { limit = 30, period = 60 }

[[previews.ratelimits]]
name = "RL_CHAT"
namespace_id = "4813"
simple = { limit = 6, period = 60 }
