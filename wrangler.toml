name = "atlens"
main = ".open-next/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "enable_request_signal"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Workers Builds rewrites Text bindings from this section on every deploy,
# overwriting anything added via the Dashboard. Non-secret config must
# live here. Secrets (e.g. GITHUB_TOKEN) stay in the Dashboard.
[vars]
SITE_URL = "https://atlens.app"
GITHUB_FEEDBACK_REPO = "sentacraft/x-glass-pipeline"
GITHUB_FEEDBACK_ASSIGNEES = "sentacraft"
AUTH_EMAIL_FROM = "login@atlens.app"

# Secret names the Worker expects; add new ones with `pnpm run secret:add`. Values live
# in `wrangler secret put` (production) and each developer's .env.local (local).
# `wrangler deploy` fails if one is missing remotely; `pnpm run env:check` (run by
# predev) warns if one is missing locally.
[secrets]
required = [
  "ANALYTICS_ID_SECRET",
  "BETTER_AUTH_SECRET",
  "CF_ACCOUNT_ID",
  "CF_ANALYTICS_TOKEN",
  "DASHSCOPE_API_KEY",
  "GITHUB_TOKEN",
  "GOOGLE_CLIENT_ID",
  "GOOGLE_CLIENT_SECRET",
  "RATE_LIMIT_BYPASS",
]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "xglass_events"

[[d1_databases]]
binding = "ASKIRIS_DB"
database_name = "atlens-askiris-traces"
database_id = "6e45555d-ee19-4a77-af3c-b7fdebd11a61"
migrations_dir = "migrations/askiris-internal"

[[d1_databases]]
binding = "APP_DB"
database_name = "atlens-app"
database_id = "6a75a5c7-643e-414b-9cd2-51cf3826a2f2"
migrations_dir = "migrations/app"

[[send_email]]
name = "EMAIL"

[version_metadata]
binding = "CF_VERSION_METADATA"

# Ask Iris daily token budgets (src/lib/ai/token-budget.ts).
[[kv_namespaces]]
binding = "RATE_KV"
id = "b4eeeb3afdca4f038de649dd3ecbea5f"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Per-IP request rates (src/lib/rate-limit.ts). namespace_id must be unique in the account.
[[ratelimits]]
name = "RL_FEEDBACK"
namespace_id = "4801"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_ASKIRIS_FEEDBACK"
namespace_id = "4802"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_CHAT"
namespace_id = "4803"
simple = { limit = 6, period = 60 }
