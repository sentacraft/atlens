name = "atlens"
main = ".open-next/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Workers Builds rewrites Text bindings from this section on every deploy,
# overwriting anything added via the Dashboard. Non-secret config must
# live here. Secrets (e.g. GITHUB_TOKEN) stay in the Dashboard.
[vars]
SITE_URL = "https://xglass.sentacraft.com"
GITHUB_FEEDBACK_REPO = "sentacraft/x-glass-pipeline"
GITHUB_FEEDBACK_ASSIGNEES = "sentacraft"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "xglass_events"

# Short-window request limit for the public /api/chat endpoint. The key is supplied
# by the Worker at runtime; Cloudflare owns the counter and window.
[[ratelimits]]
name = "ASKIRIS_BURST"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

# Short-window request limit for the public feedback endpoint. The key is supplied
# by the Worker at runtime; Cloudflare owns the counter and window.
[[ratelimits]]
name = "FEEDBACK_BURST"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60

# KV counters for /api/chat's per-IP/global daily token budgets. The RATE_LIMIT_BYPASS
# secret (dashboard / `wrangler secret put`) exempts the developer's own testing.
[[kv_namespaces]]
binding = "RATE_KV"
id = "b4eeeb3afdca4f038de649dd3ecbea5f"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
